name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Dev Container CLI
        run: npm install --global --before=2026-08-22T00:00:00Z @devcontainers/cli@0.88.0
      - name: Start Dev Container
        run: devcontainer up --workspace-folder . --config .devcontainer/ci/devcontainer.json
      - name: Install locked dependencies
        run: devcontainer exec --workspace-folder . --config .devcontainer/ci/devcontainer.json bun install --frozen-lockfile
      - name: Verify dependency release ages
        run: devcontainer exec --workspace-folder . --config .devcontainer/ci/devcontainer.json bun run check:dependencies
      - name: Install pinned test browser
        run: devcontainer exec --workspace-folder . --config .devcontainer/ci/devcontainer.json bun run test:install
      - name: Typecheck, build and test
        run: devcontainer exec --workspace-folder . --config .devcontainer/ci/devcontainer.json bun run check
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.repository.private == false
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.repository.private == false
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
