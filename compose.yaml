name: kotoba-drill-browser-app

services:
  dev:
    build:
      context: .devcontainer
      dockerfile: Dockerfile
    init: true
    command: sleep infinity
    environment:
      GH_CONFIG_DIR: /home/node/.config/gh
      DISABLE_AUTOUPDATER: "1"
    volumes:
      - .:/workspaces/main
    ports:
      - "127.0.0.1:${KOTOBA_DEV_PORT:-25173}:5173"
      - "127.0.0.1:${KOTOBA_PREVIEW_PORT:-24173}:4173"
